name: Compilar y publicar

# El sitio se publica por dos vías, porque la configuración de Pages del
# repositorio ha cambiado de modo y conviene que funcione en cualquiera:
#
#  1. Se deja el compilado en la raíz de main  -> sirve el modo "Deploy from a
#     branch" (main, /), que es el que está activo hoy.
#  2. Se sube como artefacto y se despliega    -> sirve el modo "GitHub Actions".
#
# El paso 2 puede fallar si Pages está en modo rama; por eso no interrumpe el
# resto del flujo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar
        # Con dominio propio cambia esto a "/" y agrega un archivo CNAME.
        env:
          VITE_BASE_PATH: /LACASADELARBOL309/
        run: npm run build

      - name: Publicar en la raíz
        run: ./scripts/publicar-en-raiz.sh

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "El sitio compilado no cambió."
          else
            git commit -m "Publicar sitio compilado [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: publicar
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
