name: Compilar y publicar

# GitHub Pages está configurado como "Deploy from a branch" (main, raíz), así
# que este workflow compila el sitio y deja el resultado en la raíz del
# repositorio. El código fuente vive en app/.
#
# Si algún día cambias Pages a "GitHub Actions" en Settings → Pages, conviene
# volver al flujo con actions/deploy-pages y dejar de versionar el compilado.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar
        # Con dominio propio cambia esto a "/" y agrega un archivo CNAME.
        env:
          VITE_BASE_PATH: /LACASADELARBOL309/
        run: npm run build

      - name: Publicar en la raíz
        run: ./scripts/publicar-en-raiz.sh

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "El sitio compilado no cambió."
          else
            git commit -m "Publicar sitio compilado [skip ci]"
            git push
          fi
